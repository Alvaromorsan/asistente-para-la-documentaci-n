<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Instrucciones - IES Doctora Josefa de los Reyes</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-hover: #1d4ed8;
      
      --role-badge-bg: #e0e7ff;
      --role-badge-text: #3730a3;
      
      --date-badge-bg: #fef3c7;
      --date-badge-text: #92400e;
      
      --danger-bg: #ffe4e6;
      --danger-border: #fecdd3;
      --danger-text: #9f1239;
      
      --border-color: #e2e8f0;
      --radius: 14px;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
      line-height: 1.6;
    }

    .app-container {
      max-width: 920px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      color: white;
      padding: 24px 28px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      text-align: center;
    }

    .header-logo {
      max-height: 75px;
      width: auto;
      object-fit: contain;
      background-color: rgba(255, 255, 255, 0.15);
      padding: 6px;
      border-radius: 10px;
    }

    .header-text {
      flex: 1;
      min-width: 250px;
    }

    header h1 {
      margin: 0 0 6px 0;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      opacity: 0.92;
      font-size: 0.98rem;
      font-weight: 400;
    }

    .roles-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .roles-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 14px;
    }

    .grid-roles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .btn-rol {
      background-color: var(--bg-main);
      color: var(--text-main);
