<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Instrucciones - IES Doctora Josefa de los Reyes</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      /* Colores temáticos */
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-hover: #1d4ed8;
      
      --role-badge-bg: #e0e7ff;
      --role-badge-text: #3730a3;
      
      --date-badge-bg: #fef3c7;
      --date-badge-text: #92400e;
      
      --danger-bg: #ffe4e6;
      --danger-border: #fecdd3;
      --danger-text: #9f1239;
      
      --border-color: #e2e8f0;
      --radius: 14px;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
      line-height: 1.6;
    }

    .app-container {
      max-width: 920px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      color: white;
      padding: 24px 28px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      text-align: center;
    }

    .header-logo {
      max-height: 75px;
      width: auto;
      object-fit: contain;
      background-color: rgba(255, 255, 255, 0.15);
      padding: 6px;
      border-radius: 10px;
    }

    .header-text {
      flex: 1;
      min-width: 250px;
    }

    header h1 {
      margin: 0 0 6px 0;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      opacity: 0.92;
      font-size: 0.98rem;
      font-weight: 400;
    }

    .roles-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .roles-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 14px;
    }

    .grid-roles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
    }

    .btn-rol {
      background-color: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-rol:hover {
      background-color: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
    }

    .btn-rol.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }

    .bar-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .btn-sync {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.88rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-sync:hover {
      background-color: var(--primary-soft);
    }

    .tarea-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--primary);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .tarea-card:hover {
      box-shadow: var(--shadow-md);
    }

    .tarea-card.con-retraso {
      border-left-color: #f43f5e;
    }

    .alerta-retraso {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tarea-titulo {
      margin: 0 0 14px 0;
      font-size: 1.2rem;
      color: var(--text-main);
      font-weight: 700;
      line-height: 1.35;
    }

    .meta-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .badge-rol {
      background-color: var(--role-badge-bg);
      color: var(--role-badge-text);
    }

    .badge-fecha {
      background-color: var(--date-badge-bg);
      color: var(--date-badge-text);
    }

    .instrucciones-box {
      background-color: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 10px;
      padding: 16px;
      font-size: 0.95rem;
      color: #334155;
      white-space: pre-wrap;
    }

    .instrucciones-box a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: underline;
      word-break: break-all;
    }

    .state-box {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
    }

    .state-box h3 {
      margin: 0 0 6px 0;
      color: var(--text-main);
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <img src="logo.png" alt="Logo IES Doctora Josefa de los Reyes" class="header-logo" onerror="this.style.display='none'">
    <div class="header-text">
      <h1>IES Doctora Josefa de los Reyes</h1>
      <p>Asistente virtual del profesorado para la entrega de documentación</p>
    </div>
  </header>

  <div class="roles-section">
    <div class="roles-section-title">Selecciona tu rol docente:</div>
    <div class="grid-roles">
      <button class="btn-rol" onclick="filtrarRol('Profesorado (ESO)', this)">📋 Profesorado (ESO)</button>
      <button class="btn-rol" onclick="filtrarRol('Profesorado (FP)', this)">📋 Profesorado (FP)</button>
      <button class="btn-rol" onclick="filtrarRol('Jefe/a de Departamento', this)">📋 Jefe/a Depto.</button>
      <button class="btn-rol" onclick="filtrarRol('Tutor ESO', this)">📋 Tutor ESO</button>
      <button class="btn-rol" onclick="filtrarRol('Tutor FP', this)">📋 Tutor FP</button>
      <button class="btn-rol" onclick="filtrarRol('Orientador/a', this)">📋 Orientador/a</button>
      <button class="btn-rol" onclick="filtrarRol('Jefe/a DACE', this)">📋 Jefe/a DACE</button>
    </div>
  </div>

  <div class="bar-status">
    <span id="txt-status">Elige un rol superior para cargar tus tareas.</span>
    <button class="btn-sync" onclick="cargarDatos()">🔄 Sincronizar</button>
  </div>

  <div id="contenedor-tareas">
    <div class="state-box">
      <h3>Ningún rol seleccionado</h3>
      <p>Haz clic en cualquiera de los botones de arriba para visualizar los plazos e instrucciones.</p>
    </div>
  </div>
</div>

<script>
  // PEGA AQUÍ LA URL DE TU GOOGLE SHEETS PUBLICADO COMO CSV
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTw-joIwxwmIL6BGsYebAw4X6iI9nxk5DijWImHsYEeG_WT_GGdt1BgCeNkp03ll0K-t9JGzly5ivdc/pub?gid=0&single=true&output=csv';

  let datosCSV = [];
  let rolActual = '';

  async function cargarDatos() {
    document.getElementById('txt-status').innerText = '⏳ Sincronizando con Google Sheets...';
    try {
      const response = await fetch(CSV_URL + '&nocache=' + new Date().getTime());
      const text = await response.text();
      datosCSV = parseCSV(text);
      document.getElementById('txt-status').innerText = '✅ Datos actualizados al instante.';
      if (rolActual) {
        const btnActivo = Array.from(document.querySelectorAll('.btn-rol')).find(b => b.classList.contains('active'));
        filtrarRol(rolActual, btnActivo);
      }
    } catch (e) {
      document.getElementById('contenedor-tareas').innerHTML = `
        <div class="state-box" style="border-color:#fecdd3; background:#fff1f2;">
          <h3 style="color:#9f1239;">Error de conexión</h3>
          <p>No se han podido obtener los datos de Google Sheets. Asegúrate de haber publicado la hoja correctamente como CSV.</p>
        </div>`;
    }
  }

  function parseCSV(text) {
    let rows = [];
    let currentRow = [];
    let currentVal = '';
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {
      let c = text[i];
      let nextC = text[i+1];

      if (c === '"') {
        if (insideQuotes && nextC === '"') {
          currentVal += '"';
          i++;
        } else {
          insideQuotes = !insideQuotes;
        }
      } else if (c === ',' && !insideQuotes) {
        currentRow.push(currentVal.trim());
        currentVal = '';
      } else if ((c === '\r' || c === '\n') && !insideQuotes) {
        if (c === '\r' && nextC === '\n') { i++; }
        currentRow.push(currentVal.trim());
        if (currentRow.length > 0 && currentRow.some(cell => cell !== '')) {
          rows.push(currentRow);
        }
        currentRow = [];
        currentVal = '';
      } else {
        currentVal += c;
      }
    }
    if (currentVal || currentRow.length > 0) {
      currentRow.push(currentVal.trim());
      rows.push(currentRow);
    }

    if (rows.length === 0) return [];

    let headers = rows[0].map(h => h.replace(/^"|"$/g, '').trim());
    let result = [];

    for (let i = 1; i < rows.length; i++) {
      let obj = {};
      headers.forEach((header, index) => {
        let val = rows[i][index] ? rows[i][index].replace(/^"|"$/g, '').trim() : '';
        obj[header] = val;
      });
      result.push(obj);
    }
    return result;
  }

  function autoLinkify(texto) {
    const regex = /(https?:\/\/[^\s]+)/g;
    return texto.replace(regex, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  }

  function filtrarRol(nombreRol, elementoBoton) {
    rolActual = nombreRol;

    document.querySelectorAll('.btn-rol').forEach(b => b.classList.remove('active'));
    if (elementoBoton) elementoBoton.classList.add('active');

    const contenedor = document.getElementById('contenedor-tareas');
    contenedor.innerHTML = '';

    const hoy = new Date();
    hoy.setHours(0,0,0,0);

    const tareas = datosCSV.filter(f => {
      if (!f.Rol || !f.Mostrar) return false;
      const coincideRol = f.Rol.toLowerCase().includes(nombreRol.toLowerCase());
      const valorMostrar = f.Mostrar.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      return coincideRol && valorMostrar === 'si';
    });

    tareas.sort((a, b) => {
      let fechaA = parseFecha(a.Fecha);
      let fechaB = parseFecha(b.Fecha);
      if (!fechaA) return 1;
      if (!fechaB) return -1;
      return fechaA - fechaB;
    });

    if (tareas.length === 0) {
      contenedor.innerHTML = `
        <div class="state-box">
          <h3>Sin tareas pendientes</h3>
          <p>No constan instrucciones activas registradas para el rol <strong>${nombreRol}</strong>.</p>
        </div>`;
      return;
    }

    tareas.forEach(t => {
      let esRetraso = false;
      let fechaObj = parseFecha(t.Fecha);
      if (fechaObj && fechaObj < hoy) {
        esRetraso = true;
      }

      let textoInstrucciones = autoLinkify(t.Instrucción || '');

      let htmlCard = `
        <div class="tarea-card ${esRetraso ? 'con-retraso' : ''}">
          ${esRetraso ? '<div class="alerta-retraso">⚠️ ¡ATENCIÓN! Esta tarea ya cuenta con retraso en la entrega</div>' : ''}
          <h2 class="tarea-titulo">📌 ${t.Acción || 'Sin nombre'}</h2>
          
          <div class="meta-badges">
            <span class="badge badge-rol">👤 ${t.Rol}</span>
            <span class="badge badge-fecha">📅 Fecha límite: ${t.Fecha || 'Sin fecha'}</span>
          </div>

          <div class="instrucciones-box">${textoInstrucciones}</div>
        </div>
      `;
      contenedor.innerHTML += htmlCard;
    });
  }

  function parseFecha(fechaStr) {
    if (!fechaStr || fechaStr.toLowerCase().includes('sin fecha')) return null;
    let partes = fechaStr.split(/[\/-]/);
    if (partes.length === 3) {
      let dia = parseInt(partes[0], 10);
      let mes = parseInt(partes[1], 10) - 1;
      let anio = parseInt(partes[2], 10);
      if (anio < 100) anio += 2000;
      return new Date(anio, mes, dia);
    }
    return null;
  }

  cargarDatos();
</script>

</body>
</html>
